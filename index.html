<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo App — Менеджер Задач</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      background-color: #0f1015;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    body.light-theme {
      background-color: #f4f4f5;
      color: #18181b;
    }

    .container {
      background: #18181b;
      border: 1px solid #27272a;
      width: 100%;
      max-width: 550px;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    body.light-theme .container {
      background: #ffffff;
      border-color: #e4e4e7;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 24px;
      color: #a5b4fc;
    }

    body.light-theme .header h1 {
      color: #4f46e5;
    }

    .theme-btn {
      background: none;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    body.light-theme .theme-btn {
      border-color: #d4d4d8;
      color: #18181b;
    }

    /* Прогресс-бар */
    .progress-box {
      margin-bottom: 20px;
      background: #27272a;
      padding: 12px 16px;
      border-radius: 12px;
    }

    body.light-theme .progress-box {
      background: #f4f4f5;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .progress-bar-bg {
      background: #3f3f46;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }

    body.light-theme .progress-bar-bg {
      background: #e4e4e7;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Форма ввода */
    .input-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"], input[type="date"], select {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    body.light-theme input[type="text"], 
    body.light-theme input[type="date"], 
    body.light-theme select {
      background: #f4f4f5;
      border-color: #d4d4d8;
      color: #18181b;
    }

    .todo-input {
      flex: 1;
    }

    .add-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s;
    }

    .add-btn:hover {
      transform: translateY(-2px);
    }

    /* Фильтры */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filter-btn {
      background: #27272a;
      border: none;
      color: #a1a1aa;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    body.light-theme .filter-btn {
      background: #f4f4f5;
      color: #71717a;
    }

    .filter-btn.active {
      background: #6366f1;
      color: white;
    }

    /* Список задач */
    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      background: #27272a;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      animation: fadeIn 0.3s ease;
      border-left: 4px solid transparent;
    }

    body.light-theme .todo-item {
      background: #f4f4f5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .todo-item.priority-high { border-left-color: #ef4444; }
    .todo-item.priority-medium { border-left-color: #f59e0b; }
    .todo-item.priority-low { border-left-color: #10b981; }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .todo-text-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .todo-text {
      font-size: 15px;
      word-break: break-word;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #71717a;
    }

    .todo-meta {
      font-size: 11px;
      color: #a1a1aa;
      display: flex;
      gap: 8px;
    }

    .badge {
      background: #3f3f46;
      padding: 2px 6px;
      border-radius: 4px;
    }

    body.light-theme .badge {
      background: #e4e4e7;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🚀 Super ToDo</h1>
      <button class="theme-btn" onclick="toggleTheme()">🌙 / ☀️</button>
    </div>

    <!-- Прогресс выполнения -->
    <div class="progress-box">
      <div class="progress-info">
        <span>Прогресс</span>
        <span id="progress-text">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <!-- Форма добавления -->
    <form class="input-form" id="todo-form">
      <div class="input-row">
        <input type="text" id="todo-input" class="todo-input" placeholder="Что нужно сделать?" required>
        <button type="submit" class="add-btn">+</button>
      </div>
      <div class="input-row">
        <select id="priority-select">
          <option value="low">🟢 Низкий</option>
          <option value="medium" selected>🟡 Средний</option>
          <option value="high">🔴 Высокий</option>
        </select>

        <select id="category-select">
          <option value="Разное">📁 Разное</option>
          <option value="Учеба">📚 Учеба</option>
          <option value="Проект">💻 Проект</option>
          <option value="Личное">🏠 Личное</option>
        </select>

        <input type="date" id="date-input">
      </div>
    </form>

    <!-- Фильтры -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Завершенные</button>
    </div>

    <!-- Список задач -->
    <ul class="todo-list" id="todo-list"></ul>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('super_todos')) || [];
    let currentFilter = 'all';

    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const prioritySelect = document.getElementById('priority-select');
    const categorySelect = document.getElementById('category-select');
    const dateInput = document.getElementById('date-input');
    const todoList = document.getElementById('todo-list');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // Аудиоклики с помощью Web Audio API (звук завершения задачи)
    function playSuccessSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime); // Ре
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // Ля
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    }

    function saveAndRender() {
      localStorage.setItem('super_todos', JSON.stringify(todos));
      renderTodos();
      updateProgress();
    }

    function updateProgress() {
      if (todos.length === 0) {
        document.getElementById('progress-bar').style.width = '0%';
        document.getElementById('progress-text').textContent = '0%';
        return;
      }
      const completed = todos.filter(t => t.completed).length;
      const percent = Math.round((completed / todos.length) * 100);
      document.getElementById('progress-bar').style.width = percent + '%';
      document.getElementById('progress-text').textContent = percent + '%';
    }

    function renderTodos() {
      todoList.innerHTML = '';

      const filteredTodos = todos.filter(todo => {
        if (currentFilter === 'active') return !todo.completed;
        if (currentFilter === 'completed') return todo.completed;
        return true;
      });

      filteredTodos.forEach(todo => {
        const li = document.createElement('li');
        li.className = `todo-item priority-${todo.priority} ${todo.completed ? 'completed' : ''}`;

        li.innerHTML = `
          <div class="todo-left">
            <input type="checkbox" class="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${todo.id})">
            <div class="todo-text-group">
              <span class="todo-text">${escapeHtml(todo.text)}</span>
              <div class="todo-meta">
                <span class="badge">${todo.category}</span>
                ${todo.date ? `<span>📅 ${todo.date}</span>` : ''}
              </div>
            </div>
          </div>
          <button class="delete-btn" onclick="deleteTodo(${todo.id})">🗑️</button>
        `;

        todoList.appendChild(li);
      });
    }

    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;

      const newTodo = {
        id: Date.now(),
        text: text,
        priority: prioritySelect.value,
        category: categorySelect.value,
        date: dateInput.value,
        completed: false
      };

      todos.unshift(newTodo);
      todoInput.value = '';
      dateInput.value = '';
      saveAndRender();
    });

    function toggleTodo(id) {
      todos = todos.map(todo => {
        if (todo.id === id) {
          const newState = !todo.completed;
          if (newState) playSuccessSound(); // Воспроизводим звук при галочке!
          return { ...todo, completed: newState };
        }
        return todo;
      });
      saveAndRender();
    }

    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      saveAndRender();
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderTodos();
      });
    });

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Инициализация
    saveAndRender();
  </script>
</body>
</html>

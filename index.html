<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой список задач</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f1015;
      color: #e4e4e7;
      font-family: 'Inter', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .todo-container {
      background: #18181b;
      border: 1px solid #27272a;
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h2 {
      margin-top: 0;
      color: #a5b4fc;
      text-align: center;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      background: #0f1015;
      border: 1px solid #27272a;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      padding: 12px 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f1015;
      border: 1px solid #27272a;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    li.completed span {
      text-decoration: line-through;
      color: #71717a;
    }

    li span {
      cursor: pointer;
      word-break: break-all;
      flex: 1;
      margin-right: 10px;
    }

    .delete-btn {
      background: transparent;
      color: #f43f5e;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 16px;
      border-radius: 8px;
    }

    .delete-btn:hover {
      background: rgba(244, 63, 94, 0.1);
      box-shadow: none;
      transform: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="todo-container">
    <h2>Список задач</h2>
    
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Что нужно сделать?">
      <button id="addBtn">Добавить</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой список задач</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f1015;
      color: #e4e4e7;
      font-family: 'Inter', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .todo-container {
      background: #18181b;
      border: 1px solid #27272a;
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h2 {
      margin-top: 0;
      color: #a5b4fc;
      text-align: center;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      background: #0f1015;
      border: 1px solid #27272a;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #6366f1;
    }

    button.add-btn {
      padding: 12px 20px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    button.add-btn:hover {
      background: #4f46e5;
    }

    /* Панель фильтров */
    .filters {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      gap: 5px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid #27272a;
      color: #a1a1aa;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      color: #fff;
      border-color: #52525b;
    }

    .filter-btn.active {
      background: #6366f1;
      color: white;
      border-color: #6366f1;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 300px;
      overflow-y: auto;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #0f1015;
      border: 1px solid #27272a;
      border-radius: 12px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }

    li.completed span {
      text-decoration: line-through;
      color: #71717a;
    }

    li span {
      cursor: pointer;
      flex: 1;
      word-break: break-all;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 16px;
      margin-left: 10px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    /* Подвал со счетчиком */
    .footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #27272a;
      font-size: 13px;
      color: #a1a1aa;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 13px;
      padding: 0;
    }

    .clear-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="todo-container">
    <h2>Список задач</h2>
    
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Что нужно сделать?">
      <button class="add-btn" id="addBtn">Добавить</button>
    </div>

    <!-- Кнопки фильтрации -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Завершённые</button>
    </div>

    <ul id="taskList"></ul>

    <!-- Нижняя панель с со статистикой -->
    <div class="footer-info">
      <span id="counter">Осталось: 0</span>
      <button class="clear-btn" id="clearCompleted">Очистить готовые</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

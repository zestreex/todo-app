<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой список задач</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #18181b;
      --card-border: #27272a;
      --text-color: #e4e4e7;
      --text-muted: #a1a1aa;
      --input-bg: #0f1015;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --heading-color: #a5b4fc;
    }

    /* Светлая тема */
    body.light-theme {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --card-border: #e4e4e7;
      --text-color: #18181b;
      --text-muted: #71717a;
      --input-bg: #f4f4f5;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --heading-color: #4338ca;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .todo-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .header-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      color: var(--heading-color);
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-color);
      font-size: 18px;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-color);
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    button.add-btn {
      padding: 12px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    button.add-btn:hover {
      background: var(--primary-hover);
    }

    .filters {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      gap: 5px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .filter-btn:hover {
      color: var(--text-color);
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 300px;
      overflow-y: auto;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 10px;
    }

    li.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    li span {
      cursor: pointer;
      flex: 1;
      word-break: break-all;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 16px;
      margin-left: 10px;
      opacity: 0.7;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    .footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--card-border);
      font-size: 13px;
      color: var(--text-muted);
    }

    .clear-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 13px;
      padding: 0;
    }

    .clear-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="todo-container">
    <div class="header-wrapper">
      <h2>Список задач</h2>
      <button class="theme-toggle" id="themeToggle" title="Сменить тему">🌙</button>
    </div>
    
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Что нужно сделать?">
      <button class="add-btn" id="addBtn">Добавить</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Завершённые</button>
    </div>

    <ul id="taskList"></ul>

    <div class="footer-info">
      <span id="counter">Осталось: 0</span>
      <button class="clear-btn" id="clearCompleted">Очистить готовые</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
